[package]
name = "onecore-ai"
version = "0.2.0"
description = "ONE CORE AI — локальный Windows ИИ-агент для работы с проектами и моделями"
authors = ["ONE CORE AI Contributors"]
edition = "2021"

[lib]
name = "onecore_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
