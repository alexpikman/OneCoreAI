name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Check source encoding
        run: npm run check:encoding

      - name: Type-check
        run: npm run lint

      - name: Integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Designer frontend build
        run: npm run designer:build

      - name: Setup Rust toolchain for OneCore Designer
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache OneCore Designer Rust dependencies
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: designer/src-tauri

      - name: Build OneCore Designer Windows installers
        if: runner.os == 'Windows'
        run: npm run designer:tauri:build

      - name: Upload OneCore Designer Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: onecore-designer-windows
          path: |
            designer/src-tauri/target/release/bundle/nsis/*.exe
            designer/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
